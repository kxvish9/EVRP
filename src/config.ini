# --- General Configuration ---
# ALGORITHM: The main heuristic to run. Currently only SA is supported.
# Options: SA
ALGORITHM = SA

# TRIAL_RUNS: How many independent runs to perform.
TRIAL_RUNS = 21

# TERMINATION_EVALS_FACTOR: The base number of evaluations for the termination condition.
# The final termination value is: TERMINATION_EVALS_FACTOR * PROBLEM_SIZE
TERMINATION_EVALS_FACTOR = 25000


# --- Simulated Annealing (SA) Specific Configuration ---
# Operator weights determine the probability of each operator being chosen.
# For example, weights of 70, 20, 10 mean Ruin/Recreate is chosen 70% of the time.
SA_WEIGHT_RUIN_RECREATE = 85
SA_WEIGHT_SWAP = 5
SA_WEIGHT_REMOVE_STATION = 10


# SA_INITIAL_TEMPERATURE: The starting temperature for the SA process.
SA_INITIAL_TEMPERATURE = 100.0

# SA_COOLING_RATE: The multiplicative factor for cooling the temperature.
SA_COOLING_RATE = 0.99

# Threshold (as a percentage of initial temp) to switch to fine-tuning operators.
SA_ADAPTIVE_THRESHOLD = 0.05
# SA_REHEAT_THRESHOLD: Number of iterations without improvement before reheating.
SA_REHEAT_THRESHOLD = 0.5

# SA_ITERATIONS_PER_CALL: Number of neighbors to generate in each main loop.
SA_ITERATIONS_PER_CALL = 100